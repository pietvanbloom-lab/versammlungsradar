[project]
name = "versammlungsradar"
version = "0.1.0"
description = "Zeitstrahl aller auffindbaren Versammlungen in Deutschland"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["jsonschema>=4.20"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["radar", "radar.sources"]

[tool.pytest.ini_options]
testpaths = ["tests"]
